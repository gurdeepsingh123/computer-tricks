<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Converter</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .preview-container {
            margin-top: 2rem;
            text-align: center;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        #convert-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Image Converter</h1>
    </header>

    <main>
        <div class="tool-container">
            <div class="form-group">
                <label for="image-input">Upload an Image</label>
                <input type="file" id="image-input" accept="image/*">
            </div>

            <div class="form-group">
                <label for="format-select">Convert to:</label>
                <select id="format-select">
                    <option value="png">PNG</option>
                    <option value="jpeg">JPEG</option>
                    <option value="webp">WEBP</option>
                </select>
            </div>

            <button class="btn" id="convert-btn">Convert Image</button>
            <a href="#" class="btn" id="download-btn" style="display: none;" download>Download Converted Image</a>

            <div class="preview-container" id="preview">
                <p>Image preview will appear here.</p>
            </div>
            <canvas id="convert-canvas"></canvas>
        </div>
    </main>

    <script src="js/image-converter.js"></script>
</body>
</html>
