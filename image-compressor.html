<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .quality-slider {
            width: 100%;
        }
        .preview-container {
            margin-top: 2rem;
            text-align: center;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .info-text {
            margin-top: 1rem;
            color: #555;
        }
        #compress-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Image Compressor</h1>
    </header>

    <main>
        <div class="tool-container">
            <div class="form-group">
                <label for="image-input">Upload an Image</label>
                <input type="file" id="image-input" accept="image/*">
            </div>

            <div class="form-group">
                <label for="quality-slider">Compression Quality (0.1 = Max Compression, 1 = Best Quality)</label>
                <input type="range" id="quality-slider" class="quality-slider" min="0.1" max="1" step="0.1" value="0.7">
                <p>Current Quality: <span id="quality-value">0.7</span></p>
            </div>

            <button class="btn" id="compress-btn">Compress Image</button>
            <a href="#" class="btn" id="download-btn" style="display: none;" download="compressed-image.jpg">Download Compressed Image</a>

            <div class="info-text" id="size-info" style="display: none;"></div>

            <div class="preview-container" id="preview">
                <p>Image preview will appear here.</p>
            </div>
            <canvas id="compress-canvas"></canvas>
        </div>
    </main>

    <script src="js/image-compressor.js"></script>
</body>
</html>
