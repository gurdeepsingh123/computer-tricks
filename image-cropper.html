<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Cropper</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .img-container {
            margin-top: 2rem;
            max-width: 100%;
        }
        img {
            max-width: 100%;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            text-align: center;
            margin-right: 1rem;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <h1>Image Cropper</h1>
    </header>

    <main>
        <div class="tool-container">
            <div class="form-group">
                <label for="image-input">Upload an Image</label>
                <input type="file" id="image-input" accept="image/*">
            </div>

            <div class="img-container">
                <img id="image-to-crop" src="" alt="Image preview">
            </div>

            <div style="margin-top: 1.5rem;">
                <button class="btn" id="crop-btn" style="display: none;">Crop Image</button>
                <a href="#" class="btn" id="download-btn" style="display: none;" download="cropped-image.png">Download Cropped Image</a>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <script src="js/image-cropper.js"></script>
</body>
</html>
