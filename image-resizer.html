<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .form-group input[type="file"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .dimensions {
            display: flex;
            gap: 1rem;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            text-align: center;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .preview-container {
            margin-top: 2rem;
            text-align: center;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        #resize-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Image Resizer</h1>
    </header>

    <main>
        <div class="tool-container">
            <div class="form-group">
                <label for="image-input">Upload an Image</label>
                <input type="file" id="image-input" accept="image/*">
            </div>

            <div class="form-group">
                <label>New Dimensions (in pixels)</label>
                <div class="dimensions">
                    <input type="number" id="width-input" placeholder="Width">
                    <input type="number" id="height-input" placeholder="Height">
                </div>
            </div>

            <button class="btn" id="resize-btn">Resize Image</button>
            <a href="#" class="btn btn-secondary" id="download-btn" style="display: none;" download="resized-image.png">Download Resized Image</a>

            <div class="preview-container" id="preview">
                <p>Image preview will appear here.</p>
            </div>
            <canvas id="resize-canvas"></canvas>
        </div>
    </main>

    <script src="js/image-resizer.js"></script>
</body>
</html>
